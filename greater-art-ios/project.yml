name: GreaterArt
options:
  bundleIdPrefix: com.galahad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  GreaterArt:
    type: application
    platform: iOS
    sources:
      - path: GreaterArt
        excludes:
          - Resources/Info.plist
          - Resources/GreaterArt.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galahad.greaterart
        PRODUCT_NAME: GreaterArt
        INFOPLIST_FILE: GreaterArt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GreaterArt/Resources/GreaterArt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GreaterArtTests
  GreaterArtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GreaterArtTests
    dependencies:
      - target: GreaterArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galahad.greaterart.tests
        GENERATE_INFOPLIST_FILE: YES
