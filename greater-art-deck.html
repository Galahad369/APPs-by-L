<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greater Art — What It Is</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080c;color:#c8ccd4;font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 20% 0%,rgba(0,229,255,.07) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(120,0,255,.06) 0%,transparent 50%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:100%,100%,48px 48px,48px 48px}
.wrap{max-width:860px;margin:0 auto;padding:1.5rem 1rem 3rem}
header{border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:1rem;margin-bottom:1.5rem}
h1{font-size:1.4rem;color:#e8eaf0;letter-spacing:-.02em}
.sub{color:#6b7280;font-size:.8rem;margin-top:.2rem}
.slide{display:none}
.slide.active{display:block}
.card{border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem;background:linear-gradient(135deg,rgba(14,18,28,.95),rgba(22,28,42,.9));backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card h2{font-size:1.05rem;color:#e2e6ef;font-weight:600;margin-bottom:.7rem}
.feat{display:flex;gap:.6rem;align-items:start;margin:.4rem 0;font-size:.85rem}
.feat .ico{font-size:1.1rem;min-width:1.4rem}
.ios{font-size:1rem;color:#ff6b6b;font-weight:600;padding:1rem;border:1px solid rgba(255,107,107,.25);border-radius:10px;background:rgba(255,107,107,.05)}
.btn{display:inline-flex;align-items:center;gap:.4rem;margin-top:.7rem;padding:.45rem 1rem;border-radius:8px;border:1px solid rgba(0,229,255,.25);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(120,0,255,.08));color:#c8d0e4;font-size:.82rem;font-weight:500;text-decoration:none;cursor:pointer}
.btn:hover{background:linear-gradient(135deg,rgba(0,229,255,.22),rgba(120,0,255,.14))}
nav{position:fixed;bottom:1rem;right:1rem;display:flex;gap:.4rem;align-items:center}
nav button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c8ccd4;padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.8rem}
nav button:hover{background:rgba(0,229,255,.1)}
.counter{color:#6b7280;font-size:.75rem;font-family:monospace}
.dots{display:flex;gap:.3rem}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.dots span.on{background:#00e5ff}
pre{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:.75rem .9rem;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#9ca3b8;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin-top:.6rem}
.fade-up{opacity:0;transform:translateY(24px);animation:fadeUp .7s forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}
@media(max-width:640px){.wrap{padding:1rem .6rem}.card{padding:.9rem}.btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Greater Art</h1>
<div class="sub">Offline Android media player — local music + video</div>
</header>
<div id="deck"></div>
<nav>
<div class="dots" id="dots"></div>
<span class="counter" id="counter"></span>
<button onclick="go(cur-1)">◀</button>
<button onclick="go(cur+1)">▶</button>
</nav>
</div>
<script>
const SLIDES=[];
SLIDES.push(`<div class="card">
  <h2>What Greater Art Is</h2>
  <div class="feat"><span class="ico">🎵</span><div><b>Offline music + video player</b> — local files only, no internet, no ads, no analytics.</div></div>
  <div class="feat"><span class="ico">📁</span><div><b>Scans your Download folder</b> — recursive media discovery, cached thumbnails with viewport warmup.</div></div>
  <div class="feat"><span class="ico">🎬</span><div><b>Media3 playback</b> — synchronized .lrc lyrics + embedded fallback, speed control, sleep timer.</div></div>
  <div class="feat"><span class="ico">🪟</span><div><b>Floating mini-window</b> — tiny overlay (140×46 dp audio), tap to go home, drag-to-close.</div></div>
  <div class="feat"><span class="ico">🔄</span><div><b>Repeat cycle</b> — Off → One → All → Random. Bluetooth disconnect pauses playback.</div></div>
  <div class="feat"><span class="ico">✨</span><div><b>Liquid metal skins</b> — default dark metal, custom image, muted MP4, current video backgrounds.</div></div>
  <div class="feat"><span class="ico">🔒</span><div><b>Privacy</b> — no INTERNET permission, no accounts, no telemetry, no cloud.</div></div>
  <div class="ios" style="margin-top:.8rem">📱 iOS users: go get an android phone and stop being an idiot.</div>
</div>`);
SLIDES.push(`<div class="card">
  <h2>Technical Details</h2>
  <pre>applicationId: com.local.listentomusic
Version: v1.7.8 (code 51)
Build: JDK 21 + Android SDK API 37
Media3 1.11.0 · DataStore · Lifecycle
Languages: English + Traditional Chinese</pre>
  <p style="margin-top:.7rem;font-size:.82rem;color:#9ca3b8">Pinned debug cert SHA-256: 9e28eb…8885e392a6971a80906d612fbf</p>
</div>`);
/* SLIDES_INSERT */
function build(){
  const c=document.getElementById('deck'),d=document.getElementById('dots');
  SLIDES.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(i===0?' active':'');
    el.innerHTML=s;
    c.appendChild(el);
    const dot=document.createElement('span');
    dot.onclick=()=>go(i);
    d.appendChild(dot);
  });
  upd();
}
function reAnim(i){
  const s=document.querySelectorAll('.slide')[i];
  if(!s)return;
  s.querySelectorAll('.fade-up').forEach((el,j)=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';el.style.animationDelay=(j*.15)+'s';
  });
}
function upd(){
  const ds=document.querySelectorAll('.dots span'),t=document.getElementById('counter');
  ds.forEach((s,i)=>s.classList.toggle('on',i===cur));
  t.textContent=(cur+1)+' / '+SLIDES.length;
}
let cur=0;
function go(n){
  const s=document.querySelectorAll('.slide');
  if(n<0||n>=s.length)return;
  s[cur].classList.remove('active');cur=n;s[cur].classList.add('active');reAnim(cur);upd();
}
function drawBars(){}
function drawFlow(){}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp')go(cur-1);
  if(e.key==='Home')go(0);
  if(e.key==='End')go(SLIDES.length-1);
});
let wheelLock=false;
document.addEventListener('wheel',()=>{
  if(wheelLock)return;
  wheelLock=true;go(cur+1);
  setTimeout(()=>wheelLock=false,700);
});
document.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-t0;
  if(Math.abs(dy)>50)go(dy<0?cur+1:cur-1);
},{passive:true});
let t0=0;
document.addEventListener('touchstart',e=>{t0=e.changedTouches[0].clientY},{passive:true});
/* SLIDES_INSERT */
build();
</script>
</body>
</html>
