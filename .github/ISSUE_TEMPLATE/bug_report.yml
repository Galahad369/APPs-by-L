name: Bug report
description: Report a reproducible playback, library, thumbnail, or interface problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Greater Art is offline. Never attach private media or signing files.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Greater Art
        - Useless Calculator satire
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung S24, Android 16
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Media format details
      description: Container, codec, resolution, or sample rate if relevant. Do not upload copyrighted media.
