name: Feature request
description: Suggest a focused offline playback or library improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Greater Art
        - Useless Calculator satire
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What local-media problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Features must preserve the no-network, no-analytics design.
    validations:
      required: true
