name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  greater-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Make wrapper executable
        run: chmod +x greater-art/gradlew

      - name: Test, lint, and build
        working-directory: greater-art
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: GreaterArt-debug-${{ github.sha }}
          path: greater-art/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  useless-calculator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Make wrapper executable
        run: chmod +x useless-calculator/gradlew

      - name: Test, lint, and build
        working-directory: useless-calculator
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload satire calculator APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: UselessCalculator-debug-${{ github.sha }}
          path: useless-calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
