name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.5.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag resolves to checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and verify tagged source
        working-directory: greater-art
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Prepare versioned artifact and checksum
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          src="greater-art/app/build/outputs/apk/debug/app-debug.apk"
          apk="GreaterArt-${RELEASE_TAG}-debug.apk"
          checksum="${apk}.sha256"
          test -f "$src"
          cp "$src" "$apk"
          sha256sum "$apk" > "$checksum"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create release from verified tag build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "${{ steps.asset.outputs.apk }}" \
            "${{ steps.asset.outputs.checksum }}" \
            --verify-tag \
            --title "Greater Art ${RELEASE_TAG}" \
            --notes "Built in GitHub Actions from the exact tagged source. This project currently distributes a debug-signed APK; SHA-256 is attached for integrity verification."
