name: One-time history path cleanup

on:
  push:
    branches:
      - security/history-clean-runner-2026-09-16
    paths:
      - .github/workflows/history-path-clean.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare every remote branch for rewriting
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            if [ "$branch" = "${GITHUB_REF_NAME}" ]; then
              continue
            fi
            git branch -f "$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

      - name: Rewrite workstation home paths in affected documentation
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          set -euo pipefail
          cat > /tmp/rewrite-index.py <<'PY'
          import re
          import subprocess

          targets = (
              "greater-art/draft.md",
              "greater-art/HANDOFF.md",
          )
          pattern = re.compile(
              rb"(?i)(?:[A-Za-z]:[\\/]+Users[\\/]+[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+)(?=[\\/])"
          )

          for path in targets:
              row = subprocess.run(
                  ["git", "ls-files", "-s", "--", path],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              if not row:
                  continue
              meta, indexed_path = row.split("\t", 1)
              mode, sha, stage = meta.split()
              if stage != "0":
                  raise SystemExit(f"unexpected index stage for {path}: {stage}")
              blob = subprocess.run(
                  ["git", "cat-file", "blob", sha],
                  check=True,
                  capture_output=True,
              ).stdout
              cleaned = pattern.sub(b"<user-home>", blob)
              if cleaned == blob:
                  continue
              new_sha = subprocess.run(
                  ["git", "hash-object", "-w", "--stdin"],
                  input=cleaned,
                  check=True,
                  capture_output=True,
              ).stdout.decode().strip()
              subprocess.run(
                  ["git", "update-index", "--cacheinfo", mode, new_sha, indexed_path],
                  check=True,
              )
          PY

          git filter-branch --force \
            --index-filter 'python3 /tmp/rewrite-index.py' \
            --tag-name-filter cat \
            -- --branches --tags

      - name: Verify all rewritten branch and tag history
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-history.py <<'PY'
          import re
          import subprocess
          import sys

          targets = (
              "greater-art/draft.md",
              "greater-art/HANDOFF.md",
          )
          pattern = re.compile(
              rb"(?i)(?:[A-Za-z]:[\\/]+Users[\\/]+[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+)(?=[\\/])"
          )
          commits = subprocess.run(
              ["git", "rev-list", "--branches", "--tags"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          hits = []
          for commit in commits:
              for path in targets:
                  proc = subprocess.run(
                      ["git", "show", f"{commit}:{path}"],
                      capture_output=True,
                  )
                  if proc.returncode == 0 and pattern.search(proc.stdout):
                      hits.append((commit, path))
          if hits:
              for commit, path in hits:
                  print(f"remaining workstation path: {commit} {path}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Verified {len(commits)} reachable commits: no workstation home paths remain in affected docs.")
          PY
          python3 /tmp/verify-history.py

      - name: Force-publish rewritten branches and annotated tags
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin --all
          git push --force origin --tags
