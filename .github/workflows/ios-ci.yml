name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "greater-art-ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "greater-art-ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate privacy and app metadata
        run: |
          plutil -lint greater-art-ios/GreaterArt/Resources/Info.plist
          plutil -lint greater-art-ios/GreaterArt/Resources/PrivacyInfo.xcprivacy
          plutil -lint greater-art-ios/GreaterArt/Resources/GreaterArt.entitlements

      - name: Compile app and unit-test bundle without signing
        run: >-
          xcodebuild build-for-testing
          -project greater-art-ios/GreaterArt.xcodeproj
          -scheme GreaterArt
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

